// ---- API-backed replacement for the artifact-only window.storage API ----
// Backed by /api/state (Postgres via the Express server), scoped per profile
// so each person's data is independent, visible from their phone, the
// browser, and Claude reading the API directly.
const storage = {
  async get(profileId) {
    const res = await fetch(`/api/state?profile=${encodeURIComponent(profileId)}`);
    if (!res.ok) throw new Error('failed to fetch state');
    const data = await res.json();
    if (data.value === null || data.value === undefined) throw new Error('not found');
    return { value: JSON.stringify(data.value) };
  },
  async set(profileId, value) {
    const res = await fetch(`/api/state?profile=${encodeURIComponent(profileId)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.parse(value) }),
    });
    if (!res.ok) throw new Error('failed to save state');
    return { value };
  }
};

// Two alternating "phase" weeks. Each week has the same 4 day slots, but
// different exercise groupings. Weight/history for a given exercise id is
// shared no matter which week/day it's logged under.
const WEEKS = {
  1: {
    '1': { label: 'Push',        exercises: ['inclinePress', 'flatBench', 'shoulderPress', 'cableLateral', 'ropePressdown', 'lowHighFly'] },
    '2': { label: 'Pull',        exercises: ['latPulldown', 'singleArmRow', 'ezBarCurl', 'farmersCarry'] },
    '3': { label: 'Legs',        exercises: ['legPress', 'rdl', 'walkingLunges', 'seatedLegCurl', 'proneLegCurl', 'calfRaises'] },
    '4': { label: 'Accessory',   exercises: ['closeGripBench', 'preacherCurl', 'hammerCurl', 'ropePressdown'] },
  },
  2: {
    '1': { label: 'Back & Chest',      exercises: ['latPulldown', 'flatBench', 'singleArmRow', 'inclinePress', 'lowHighFly'] },
    '2': { label: 'Arms & Shoulders',  exercises: ['shoulderPress', 'cableLateral', 'ezBarCurl', 'ropePressdown', 'hammerCurl', 'closeGripBench'] },
    '3': { label: 'Legs',              exercises: ['legPress', 'rdl', 'walkingLunges', 'seatedLegCurl', 'proneLegCurl', 'calfRaises'] },
    '4': { label: 'Conditioning',      exercises: ['landmineTwist', 'kettlebellHalo', 'suitcaseCarry'] },
  },
};

function defaultCompletedDays() {
  return { '1': false, '2': false, '3': false, '4': false };
}

function defaultMeta() {
  return { week: 1, completedDays: { 1: defaultCompletedDays(), 2: defaultCompletedDays() } };
}

// One exercise's stored data object: weight (+ optional weightL/weightR),
// history, a free-text notes field, and the state the Easy/Hard oscillation
// logic needs (repTarget/repPhase/hardStreak).
function defaultExerciseState(id, ex) {
  return {
    weight: ex.weight, weightL: ex.weightL, weightR: ex.weightR,
    history: [],
    notes: id === 'farmersCarry' ? '40m per set, plus shoulder shrugs after' : '',
    repTarget: ex.repMax,
    repPhase: 'push',
    hardStreak: 0,
  };
}

function buildDefaultState() {
  const s = {};
  Object.entries(EXERCISES).forEach(([id, ex]) => {
    s[id] = defaultExerciseState(id, ex);
  });
  return s;
}

// Patches older saved state: adds any exercise ids that didn't exist yet
// when it was saved, backfills the Easy/Hard oscillation fields onto older
// exercise entries that predate them, and ensures __meta (week/completion
// tracking) exists.
function normalizeState(loaded) {
  const s = { ...loaded };
  Object.entries(EXERCISES).forEach(([id, ex]) => {
    if (!s[id]) {
      s[id] = defaultExerciseState(id, ex);
    } else {
      if (s[id].repTarget === undefined) s[id].repTarget = ex.repMax;
      if (s[id].repPhase === undefined) s[id].repPhase = 'push';
      if (s[id].hardStreak === undefined) s[id].hardStreak = 0;
    }
  });
  if (!s.__meta) {
    s.__meta = defaultMeta();
  } else {
    s.__meta = { week: s.__meta.week === 2 ? 2 : 1, completedDays: { ...s.__meta.completedDays } };
    [1, 2].forEach(w => { if (!s.__meta.completedDays[w]) s.__meta.completedDays[w] = defaultCompletedDays(); });
  }
  return s;
}

// Recomputes whether `dayNum` (in `week`) is fully covered by `coveredIds`
// (logged + skipped exercise ids), updates completedDays, and auto-flips
// to the other week once all 4 days in the current week are complete.
function updateMetaAfterAction(meta, week, dayNum, coveredIds) {
  const daysForWeek = WEEKS[week];
  const dayComplete = daysForWeek[dayNum].exercises.every(exId => coveredIds.includes(exId));
  const completedDays = { ...meta.completedDays, [week]: { ...meta.completedDays[week], [dayNum]: dayComplete } };
  const allDaysComplete = Object.keys(daysForWeek).every(d => completedDays[week][d]);
  const nextWeek = allDaysComplete ? (week === 1 ? 2 : 1) : week;
  return { ...meta, week: nextWeek, completedDays };
}

// Resolves an overall Easy/Hard verdict for the session from any per-set
// marks, falling back to whichever "Log Session" button was actually
// pressed when no sets were marked (or the marks are a genuine tie).
function resolveVerdict(marks, buttonPressed, numSets) {
  const touched = marks.filter(Boolean);
  if (touched.length === 0) return buttonPressed;

  if (numSets === 3) {
    const easyCount = touched.filter(m => m === 'easy').length;
    const hardCount = touched.filter(m => m === 'hard').length;
    if (easyCount >= 2) return 'easy';
    if (hardCount >= 2) return 'hard';
    return buttonPressed; // genuine tie fallback
  }

  // 2-set exercises
  if (marks[0] === 'hard' && marks[1] === 'hard') return 'hard';
  const last = [...marks].reverse().find(Boolean);
  return last || buttonPressed;
}

// Decision engine: given the resolved verdict, returns the updated
// weight/repTarget/repPhase/hardStreak for an exercise. noReps exercises
// (Farmer's Carry, Suitcase Carry) skip all rep logic and only return
// weight/hardStreak.
function applyVerdict(ex, cur, verdict) {
  const baseline = ex.repMax;
  const floor = baseline - 2;
  let { weight, repTarget, repPhase, hardStreak } = cur;

  if (ex.noReps) {
    if (verdict === 'easy') { weight += ex.increment; hardStreak = 0; }
    else {
      hardStreak += 1;
      if (hardStreak >= 2) { weight -= ex.increment; hardStreak = 0; }
    }
    return { weight, hardStreak };
  }

  if (verdict === 'easy') {
    hardStreak = 0;
    if (repPhase === 'push') {
      weight += ex.increment;
      repTarget = Math.max(repTarget - 2, floor);
      repPhase = 'recover';
    } else {
      repTarget = Math.min(repTarget + 2, baseline);
      repPhase = 'push';
    }
  } else { // hard
    repTarget = Math.max(repTarget - 2, floor);
    hardStreak += 1;
    if (hardStreak >= 2) {
      weight -= ex.increment;
      repTarget = baseline;   // reset on the weight drop
      hardStreak = 0;
    }
  }
  return { weight, repTarget, repPhase, hardStreak };
}

function CopySummaryButton({ text, label }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // clipboard API blocked — fall back to a temporary textarea
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  return (
    <button
      onClick={handleCopy}
      style={{ width: '100%', padding: '8px 16px', borderRadius: 8, border: '1px solid #52525b', background: copied ? '#166534' : '#27272a', color: copied ? '#86efac' : '#e4e4e7', fontSize: 13, cursor: 'pointer', marginTop: 6 }}
    >
      {copied ? '✓ Copied — paste it to Claude in chat' : label}
    </button>
  );
}

function ExerciseCard({ id, ex, data, onLog, onSaveNotes, onEditWeight, skipped, onSkip }) {
  const [open, setOpen] = useState(false);
  const [sets, setSets] = useState(Array.from({ length: ex.sets }, () => ({ reps: ex.repMax || '' })));
  const [marks, setMarks] = useState(Array.from({ length: ex.sets }, () => null));
  const [logged, setLogged] = useState(false);
  const [verdict, setVerdict] = useState(null);
  const [note, setNote] = useState(data.notes || '');
  const [editingWeight, setEditingWeight] = useState(false);
  const [editW, setEditW] = useState('');
  const [editWL, setEditWL] = useState('');
  const [editWR, setEditWR] = useState('');

  const weightLabel = ex.weightL !== undefined
    ? `L ${data.weightL}${ex.unit} / R ${data.weightR}${ex.unit}`
    : `${data.weight}${ex.unit}`;

  const trend = data.history.slice(-4).map(h => h.weightLabel).join(' → ');
  const last = data.history[data.history.length - 1];

  const toggleMark = (i, val) => {
    setMarks(prev => prev.map((m, idx) => (idx === i ? (m === val ? null : val) : m)));
  };

  const doLog = (buttonPressed) => {
    const verd = resolveVerdict(marks, buttonPressed, ex.sets);
    setVerdict(verd);
    setLogged(true);
    onLog(id, sets, marks, verd, note);
  };

  const openWeightEdit = () => {
    setEditW(data.weight != null ? String(data.weight) : '');
    setEditWL(data.weightL != null ? String(data.weightL) : '');
    setEditWR(data.weightR != null ? String(data.weightR) : '');
    setEditingWeight(true);
  };

  const handleSaveWeight = (e) => {
    e.stopPropagation();
    const updates = ex.weightL !== undefined
      ? { weightL: parseFloat(editWL) || 0, weightR: parseFloat(editWR) || 0 }
      : { weight: parseFloat(editW) || 0 };
    onEditWeight(id, updates);
    setEditingWeight(false);
  };

  const handleCancelWeight = (e) => {
    e.stopPropagation();
    setEditingWeight(false);
  };

  const markLabel = m => (m === 'easy' ? 'Easy' : m === 'hard' ? 'Hard' : '');

  const summaryText = (() => {
    const wLabel = ex.weightL !== undefined ? `L ${data.weightL}kg / R ${data.weightR}kg` : `${data.weight}${ex.unit}`;
    const setsDesc = sets.map((s, i) => {
      const m = markLabel(marks[i]);
      return ex.noReps ? `Set ${i+1}${m ? `: ${m}` : ''}` : `Set ${i+1}: ${s.reps} reps${m ? ` — ${m}` : ''}`;
    }).join(', ');
    let text =
      `[Training log — ${ex.name}]\n` +
      `Weight: ${wLabel} | Sets: ${setsDesc} | Target: ${ex.noReps ? 'carries' : `${ex.repMin}–${ex.repMax} reps`}\n` +
      `Session verdict: ${verdict ? markLabel(verdict) : 'N/A'}\n` +
      `Right elbow caution: ${ex.caution ? 'YES' : 'no'}`;
    if (note.trim()) text += `\nMy note: ${note}`;
    return text + `\n\nCan you give me a quick read on this and what to do next time?`;
  })();

  return (
    <div style={{ border: '1px solid #292524', borderRadius: 12, background: '#1c1917', marginBottom: 8, overflow: 'hidden' }}>
      <div
        onClick={() => setOpen(o => !o)}
        style={{ width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 14px', cursor: 'pointer', textAlign: 'left' }}
      >
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: skipped ? '#57534e' : logged ? '#86efac' : '#f5f5f4' }}>
              {skipped ? '⊘ ' : logged ? '✓ ' : ''}{ex.name}
            </span>
            {skipped && (
              <span style={{ fontSize: 11, color: '#57534e' }}>skipped today</span>
            )}
            {ex.caution && (
              <span style={{ fontSize: 11, background: '#431407', color: '#fb923c', padding: '1px 6px', borderRadius: 4, border: '1px solid #7c2d12', flexShrink: 0 }}>
                ⚠ elbow
              </span>
            )}
          </div>
          <div style={{ fontSize: 14, color: '#f5f5f4', marginTop: 2, display: 'flex', alignItems: 'center', gap: 6 }}>
            <span>{weightLabel} · {ex.sets} × {ex.noReps ? 'carries' : (ex.repMin === ex.repMax ? ex.repMin : `${ex.repMin}–${ex.repMax}`)}</span>
            <button
              onClick={e => { e.stopPropagation(); editingWeight ? setEditingWeight(false) : openWeightEdit(); }}
              style={{ background: 'none', border: 'none', color: '#78716c', fontSize: 12, cursor: 'pointer', padding: 0, flexShrink: 0 }}
            >
              ✏️
            </button>
          </div>
          {editingWeight && (
            <div onClick={e => e.stopPropagation()} style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
              {ex.weightL !== undefined ? (
                <>
                  <input
                    type="number" inputMode="decimal" value={editWL} placeholder="Left"
                    onChange={e => setEditWL(e.target.value)}
                    style={{ width: 64, background: '#0c0a09', border: '1px solid #3f3f46', borderRadius: 8, padding: '5px 7px', fontSize: 12, color: '#f5f5f4' }}
                  />
                  <input
                    type="number" inputMode="decimal" value={editWR} placeholder="Right"
                    onChange={e => setEditWR(e.target.value)}
                    style={{ width: 64, background: '#0c0a09', border: '1px solid #3f3f46', borderRadius: 8, padding: '5px 7px', fontSize: 12, color: '#f5f5f4' }}
                  />
                </>
              ) : (
                <input
                  type="number" inputMode="decimal" value={editW}
                  onChange={e => setEditW(e.target.value)}
                  style={{ width: 70, background: '#0c0a09', border: '1px solid #3f3f46', borderRadius: 8, padding: '5px 7px', fontSize: 12, color: '#f5f5f4' }}
                />
              )}
              <button onClick={handleSaveWeight} style={{ fontSize: 12, fontWeight: 600, padding: '5px 10px', borderRadius: 6, background: '#166534', border: 'none', color: '#fff', cursor: 'pointer' }}>Save</button>
              <button onClick={handleCancelWeight} style={{ fontSize: 12, padding: '5px 10px', borderRadius: 6, background: 'none', border: '1px solid #3f3f46', color: '#a8a29e', cursor: 'pointer' }}>Cancel</button>
            </div>
          )}
          {data.notes && (
            <div style={{ fontSize: 14, color: '#f5f5f4', marginTop: 1, fontStyle: 'italic', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {data.notes}
            </div>
          )}
        </div>
        <span style={{ color: '#78716c', fontSize: 16, marginLeft: 8, flexShrink: 0 }}>{open ? '▲' : '▼'}</span>
      </div>

      {open && skipped && (
        <div style={{ borderTop: '1px solid #292524', padding: '12px 14px' }}>
          <div style={{ fontSize: 13, color: '#78716c', marginBottom: 10 }}>
            Marked as skipped for today — won't affect your weight or history.
          </div>
          <button
            onClick={() => onSkip(id)}
            style={{ width: '100%', padding: 10, borderRadius: 8, background: '#27272a', border: '1px solid #3f3f46', color: '#e4e4e7', fontSize: 13, cursor: 'pointer' }}
          >
            Undo — I did do this today
          </button>
        </div>
      )}

      {open && !skipped && (
        <div style={{ borderTop: '1px solid #292524', padding: '12px 14px' }}>
          {ex.note && (
            <div style={{ fontSize: 12, color: '#fbbf24', background: 'rgba(120,53,15,0.3)', border: '1px solid rgba(161,98,7,0.4)', borderRadius: 8, padding: '7px 10px', marginBottom: 10 }}>
              ℹ {ex.note}
            </div>
          )}
          {trend && <div style={{ fontSize: 14, color: '#f5f5f4', marginBottom: 10 }}>📈 {trend}</div>}

          {sets.map((s, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 7 }}>
              <span style={{ fontSize: 14, color: '#f5f5f4', width: 44, flexShrink: 0 }}>Set {i+1}</span>
              {!ex.noReps && (
                <input
                  type="number" inputMode="numeric" value={s.reps}
                  onChange={e => setSets(prev => prev.map((x, idx) => idx === i ? { ...x, reps: e.target.value === '' ? '' : Number(e.target.value) } : x))}
                  placeholder="reps"
                  style={{ width: 60, background: '#0c0a09', border: '1px solid #292524', borderRadius: 8, padding: '6px 8px', fontSize: 14, color: '#f5f5f4', textAlign: 'center' }}
                />
              )}
              <div style={{ display: 'flex', gap: 4, flex: 1 }}>
                <button
                  onClick={() => toggleMark(i, 'easy')}
                  style={{ flex: 1, padding: '6px 4px', borderRadius: 8, border: '1px solid #444', background: marks[i] === 'easy' ? '#166534' : 'transparent', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                >
                  Easy
                </button>
                <button
                  onClick={() => toggleMark(i, 'hard')}
                  style={{ flex: 1, padding: '6px 4px', borderRadius: 8, border: '1px solid #444', background: marks[i] === 'hard' ? '#991b1b' : 'transparent', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                >
                  Hard
                </button>
              </div>
            </div>
          ))}

          <div style={{ marginTop: 10 }}>
            <textarea
              value={note}
              onChange={e => setNote(e.target.value)}
              onBlur={() => onSaveNotes(id, note)}
              rows={2}
              placeholder="Notes — variations, distances, swaps…"
              style={{ width: '100%', background: '#0c0a09', border: '1px solid #292524', borderRadius: 8, padding: '7px 10px', fontSize: 12, color: '#e7e5e4', resize: 'none', fontFamily: 'system-ui', boxSizing: 'border-box' }}
            />
          </div>

          <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
            <button
              onClick={() => doLog('easy')}
              style={{ flex: 1, padding: 10, borderRadius: 8, background: '#166534', border: 'none', color: '#fff', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
            >
              Log Session — Easy
            </button>
            <button
              onClick={() => doLog('hard')}
              style={{ flex: 1, padding: 10, borderRadius: 8, background: '#991b1b', border: 'none', color: '#fff', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}
            >
              Log Session — Hard
            </button>
          </div>

          {!logged && (
            <button
              onClick={() => onSkip(id)}
              style={{ width: '100%', padding: 6, background: 'none', border: 'none', color: '#57534e', fontSize: 12, cursor: 'pointer', marginTop: 6 }}
            >
              Didn't do this today
            </button>
          )}

          {logged && (
            <div style={{ marginTop: 10, padding: '12px', borderRadius: 10, border: '1px solid #3f3f46', background: '#18181b' }}>
              <div style={{ fontSize: 12, color: '#a1a1aa', marginBottom: 6, fontWeight: 600 }}>
                Verdict: {markLabel(verdict)}
              </div>
              <CopySummaryButton text={summaryText} label="Copy summary to ask Claude →" />
            </div>
          )}

          {last && (
            <div style={{ fontSize: 14, color: '#f5f5f4', marginTop: 10 }}>
              Last ({last.weightLabel}): {last.sets.map(s => ex.noReps ? (markLabel(s.mark) || '–') : `${s.reps}${s.mark ? `(${markLabel(s.mark)})` : ''}`).join(', ')}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SessionSummary({ day, exData, loggedIds, skippedIds, onDone }) {
  const increases = loggedIds.map(id => {
    const hist = exData[id].history;
    if (hist.length < 2) return null;
    const prev = hist[hist.length - 2]?.weightLabel;
    const curr = hist[hist.length - 1]?.weightLabel;
    if (prev && curr && prev !== curr) return `${EXERCISES[id].name}: ${prev} → ${curr}`;
    return null;
  }).filter(Boolean);

  const summaryText = (() => {
    const lines = loggedIds.map(id => {
      const ex = EXERCISES[id];
      const last = exData[id].history[exData[id].history.length - 1];
      if (!last) return null;
      const setsDesc = last.sets.map(s => ex.noReps ? (s.mark || 'no mark') : `${s.reps}${s.mark ? ` (${s.mark})` : ''}`).join(', ');
      return `• ${ex.name} (${last.weightLabel}): ${setsDesc}`;
    }).filter(Boolean).join('\n');

    return `[Training log — Day ${day} session complete]\n\n` +
      `Exercises logged:\n${lines}\n\n` +
      `Weight increases this session:\n${increases.length ? increases.map(i => `• ${i}`).join('\n') : '• None'}\n\n` +
      `Can you give me a quick review, flag anything for my right elbow (tennis elbow), and give one priority focus for next time?`;
  })();

  return (
    <div style={{ margin: '16px 0', border: '1px solid #3f3f46', borderRadius: 14, background: '#18181b', overflow: 'hidden' }}>
      <div style={{ padding: '14px 16px', borderBottom: '1px solid #27272a' }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#f4f4f5' }}>Session complete 🎉</div>
        <div style={{ fontSize: 13, color: '#71717a', marginTop: 2 }}>
          Day {day} · {loggedIds.length} exercises logged
          {skippedIds.length > 0 && ` · ${skippedIds.length} skipped`}
        </div>
      </div>

      {increases.length > 0 && (
        <div style={{ padding: '12px 16px', borderBottom: '1px solid #27272a' }}>
          <div style={{ fontSize: 11, color: '#71717a', marginBottom: 6, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Weight increases</div>
          {increases.map((inc, i) => (
            <div key={i} style={{ fontSize: 13, color: '#86efac', marginBottom: 3 }}>↑ {inc}</div>
          ))}
        </div>
      )}

      <div style={{ padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        <CopySummaryButton text={summaryText} label="Copy session summary to ask Claude →" />
        <button
          onClick={onDone}
          style={{ width: '100%', padding: 11, borderRadius: 8, background: '#16a34a', border: 'none', color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}
        >
          Finish &amp; save session ✓
        </button>
      </div>
    </div>
  );
}

function CoachFeedback({ profileId }) {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(`/api/feedback?profile=${encodeURIComponent(profileId)}&unread=true`);
        if (res.ok) setItems(await res.json());
      } catch {}
      setLoaded(true);
    })();
  }, [profileId]);

  const dismiss = async (id) => {
    setItems(prev => prev.filter(i => i.id !== id));
    try { await fetch(`/api/feedback/${id}/read`, { method: 'PATCH' }); } catch {}
  };

  if (!loaded || items.length === 0) return null;

  return (
    <div style={{ marginBottom: 16 }}>
      {items.map(item => (
        <div key={item.id} style={{ border: '1px solid #1e3a8a', background: 'rgba(30,58,138,0.2)', borderRadius: 10, padding: '10px 12px', marginBottom: 8 }}>
          <div style={{ fontSize: 11, color: '#93c5fd', fontWeight: 600, marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
            Coach note{item.exercise_id && EXERCISES[item.exercise_id] ? ` — ${EXERCISES[item.exercise_id].name}` : ''}
          </div>
          <div style={{ fontSize: 13, color: '#dbeafe', whiteSpace: 'pre-wrap' }}>{item.message}</div>
          <button
            onClick={() => dismiss(item.id)}
            style={{ marginTop: 8, fontSize: 12, color: '#93c5fd', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}
          >
            Dismiss
          </button>
        </div>
      ))}
    </div>
  );
}

function TrainingLog({ profileId, profileName, onSwitchProfile }) {
  const [day, setDay] = useState('1');
  const [exData, setExData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loggedIds, setLoggedIds] = useState([]);
  const [skippedIds, setSkippedIds] = useState([]);
  const [sessionDone, setSessionDone] = useState(false);
  const [manualOpen, setManualOpen] = useState(false);

  useEffect(() => {
    (async () => {
      let s;
      try {
        const r = await storage.get(profileId);
        s = normalizeState(JSON.parse(r.value));
      } catch {
        s = normalizeState(buildDefaultState());
      }
      setExData(s);
      try { await storage.set(profileId, JSON.stringify(s)); } catch {}
      setLoading(false);
    })();
  }, [profileId]);

  useEffect(() => { setLoggedIds([]); setSkippedIds([]); setSessionDone(false); }, [day]);

  const persist = async (next) => {
    setExData(next);
    try { await storage.set(profileId, JSON.stringify(next)); } catch {}
  };

  const handleLog = (id, sets, marks, verdict, note) => {
    const ex = EXERCISES[id];
    const cur = exData[id];
    const today = new Date().toISOString().slice(0,10);
    const historySets = sets.map((s, i) => ex.noReps ? { mark: marks[i] } : { reps: s.reps, mark: marks[i] });
    let next = { ...cur, history: [...cur.history], notes: note };

    if (ex.weightL !== undefined) {
      const result = applyVerdict(ex, { weight: cur.weightL, repTarget: cur.repTarget, repPhase: cur.repPhase, hardStreak: cur.hardStreak }, verdict);
      next.weightL = +Number(result.weight).toFixed(2);
      if (result.repTarget !== undefined) next.repTarget = result.repTarget;
      if (result.repPhase !== undefined) next.repPhase = result.repPhase;
      next.hardStreak = result.hardStreak;
      next.history.push({ date: today, weightLabel: `L${next.weightL}/R${cur.weightR}`, sets: historySets });
    } else {
      const result = applyVerdict(ex, cur, verdict);
      next.weight = +Number(result.weight).toFixed(2);
      if (result.repTarget !== undefined) next.repTarget = result.repTarget;
      if (result.repPhase !== undefined) next.repPhase = result.repPhase;
      next.hardStreak = result.hardStreak;
      next.history.push({ date: today, weightLabel: `${next.weight}${ex.unit}`, sets: historySets });
    }
    next.history = next.history.slice(-6);

    const week = exData.__meta.week;
    const nextLoggedIds = loggedIds.includes(id) ? loggedIds : [...loggedIds, id];
    const nextMeta = updateMetaAfterAction(exData.__meta, week, day, [...nextLoggedIds, ...skippedIds]);
    const weekChanged = nextMeta.week !== week;

    persist({ ...exData, [id]: next, __meta: nextMeta });
    if (weekChanged) {
      setDay('1');
      setLoggedIds([]);
      setSkippedIds([]);
      setSessionDone(false);
    } else {
      setLoggedIds(nextLoggedIds);
    }
  };

  const handleSaveNotes = (id, note) => {
    const cur = { ...exData[id], notes: note };
    persist({ ...exData, [id]: cur });
  };

  const handleEditWeight = (id, updates) => {
    const cur = { ...exData[id], ...updates };
    persist({ ...exData, [id]: cur });
  };

  const handleSkip = (id) => {
    const nextSkippedIds = skippedIds.includes(id) ? skippedIds.filter(x => x !== id) : [...skippedIds, id];

    const week = exData.__meta.week;
    const nextMeta = updateMetaAfterAction(exData.__meta, week, day, [...loggedIds, ...nextSkippedIds]);
    const weekChanged = nextMeta.week !== week;

    persist({ ...exData, __meta: nextMeta });
    if (weekChanged) {
      setDay('1');
      setLoggedIds([]);
      setSkippedIds([]);
      setSessionDone(false);
    } else {
      setSkippedIds(nextSkippedIds);
    }
  };

  const handleReset = async () => {
    if (!window.confirm('Reset all progress back to starting weights?')) return;
    const d = normalizeState(buildDefaultState());
    await persist(d);
    setDay('1');
    setLoggedIds([]);
    setSkippedIds([]);
    setSessionDone(false);
  };

  const handleForceWeekSwitch = () => {
    const week = exData.__meta.week;
    const nextWeek = week === 1 ? 2 : 1;
    if (!window.confirm(`Switch to Week ${nextWeek} now?`)) return;
    persist({ ...exData, __meta: { ...exData.__meta, week: nextWeek } });
    setDay('1');
    setLoggedIds([]);
    setSkippedIds([]);
    setSessionDone(false);
  };

  const week = exData && exData.__meta.week;
  const daysForWeek = exData && WEEKS[week];
  const allLogged = exData && daysForWeek[day].exercises.every(id => loggedIds.includes(id) || skippedIds.includes(id));

  if (loading) return (
    <div style={{ minHeight: 200, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0c0a09', color: '#78716c', fontFamily: 'system-ui' }}>
      Loading…
    </div>
  );

  return (
    <div style={{ minHeight: '100vh', background: '#0c0a09', color: '#f5f5f4', padding: '16px', maxWidth: 480, margin: '0 auto', fontFamily: 'system-ui, sans-serif' }}>
      <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
        <button
          onClick={() => setManualOpen(true)}
          style={{ flex: 1, fontSize: 13, fontWeight: 600, padding: '6px 4px', background: '#1d4ed8', border: '1px solid #1d4ed8', color: '#fff', borderRadius: 8, cursor: 'pointer' }}
        >
          📖 Manual
        </button>
        <button
          onClick={handleForceWeekSwitch}
          style={{ flex: 1, fontSize: 13, fontWeight: 600, padding: '6px 4px', background: '#1d4ed8', border: '1px solid #1d4ed8', color: '#fff', borderRadius: 8, cursor: 'pointer' }}
        >
          Switch to Week {week === 1 ? 2 : 1} →
        </button>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 22 }}>🏋️</span>
          <h1 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Training Log — {profileName}</h1>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: '#78716c' }}>
          Week {week} · Day {day} — {daysForWeek[day].label}
        </div>
        <button
          onClick={onSwitchProfile}
          style={{ fontSize: 11, color: '#57534e', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}
        >
          Not {profileName}?
        </button>
      </div>

      <CoachFeedback profileId={profileId} />

      <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
        {Object.keys(daysForWeek).map(d => {
          const isSelected = d === day;
          const isComplete = exData.__meta.completedDays[week][d];
          const bg = isSelected ? '#c2410c' : isComplete ? '#166534' : '#1c1917';
          const borderColor = isSelected ? '#c2410c' : isComplete ? '#16a34a' : '#292524';
          const color = isSelected || isComplete ? '#fff' : '#78716c';
          return (
            <button key={d} onClick={() => setDay(d)} style={{
              flex: 1, padding: '8px 4px', borderRadius: 8,
              border: '1px solid', borderColor, background: bg, color,
              fontSize: 13, fontWeight: 600, cursor: 'pointer'
            }}>
              Day {d}
            </button>
          );
        })}
      </div>

      {sessionDone ? (
        <div style={{ textAlign: 'center', padding: '40px 20px' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: '#86efac', marginBottom: 6 }}>Session saved!</div>
          <div style={{ fontSize: 14, color: '#78716c', marginBottom: 20 }}>All weights and notes updated for next time.</div>
          <button
            onClick={() => { setSessionDone(false); setLoggedIds([]); setSkippedIds([]); }}
            style={{ padding: '10px 24px', borderRadius: 8, background: '#1c1917', border: '1px solid #292524', color: '#f5f5f4', fontSize: 14, cursor: 'pointer' }}
          >
            Start another session
          </button>
        </div>
      ) : (
        <>
          {daysForWeek[day].exercises.map((id, idx) => (
            <ExerciseCard
              key={`${week}-${day}-${id}-${idx}`}
              id={id} ex={EXERCISES[id]} data={exData[id]}
              onLog={handleLog} onSaveNotes={handleSaveNotes} onEditWeight={handleEditWeight}
              skipped={skippedIds.includes(id)} onSkip={handleSkip}
            />
          ))}

          {(loggedIds.length > 0 || skippedIds.length > 0) && !allLogged && (
            <>
              <div style={{ textAlign: 'center', fontSize: 13, color: '#57534e', padding: '10px 0' }}>
                {loggedIds.length + skippedIds.length} / {daysForWeek[day].exercises.length} exercises done
              </div>
              <button
                onClick={() => setSessionDone(true)}
                style={{ width: '100%', padding: 10, borderRadius: 8, background: 'none', border: '1px solid #292524', color: '#57534e', fontSize: 13, cursor: 'pointer' }}
              >
                Finish early (save partial session)
              </button>
            </>
          )}

          {allLogged && (
            <SessionSummary day={day} exData={exData} loggedIds={loggedIds} skippedIds={skippedIds} onDone={() => setSessionDone(true)} />
          )}
        </>
      )}

      <button
        onClick={handleReset}
        style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#44403c', background: 'none', border: 'none', cursor: 'pointer', margin: '24px auto 0', padding: 6 }}
      >
        ↺ Reset all progress
      </button>

      {manualOpen && <ManualModal onClose={() => setManualOpen(false)} />}
    </div>
  );
}

const PROFILE_STORAGE_KEY = 'trainingLogProfile';

// Fixed roster picker — no self-signup. Lee assigns spare slots to real
// people (via a rename), so this just lists whoever the server already
// knows about.
function ProfilePicker({ onSelect }) {
  const [profiles, setProfiles] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch('/api/profiles');
        setProfiles(res.ok ? await res.json() : []);
      } catch {
        setProfiles([]);
      }
    })();
  }, []);

  return (
    <div style={{ minHeight: '100vh', background: '#0c0a09', color: '#f5f5f4', padding: '16px', maxWidth: 480, margin: '0 auto', fontFamily: 'system-ui, sans-serif', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
      <div style={{ textAlign: 'center', marginBottom: 24 }}>
        <div style={{ fontSize: 32 }}>🏋️</div>
        <h1 style={{ fontSize: 20, fontWeight: 700, margin: '8px 0 4px' }}>Who's training?</h1>
        <div style={{ fontSize: 13, color: '#78716c' }}>Each person has their own weights and history.</div>
      </div>

      {profiles === null ? (
        <div style={{ textAlign: 'center', color: '#78716c' }}>Loading…</div>
      ) : profiles.length === 0 ? (
        <div style={{ textAlign: 'center', color: '#78716c' }}>Couldn't load the list — try reloading.</div>
      ) : (
        profiles.map(p => (
          <button
            key={p.id}
            onClick={() => onSelect(p)}
            style={{ width: '100%', padding: 14, borderRadius: 10, marginBottom: 8, background: '#1c1917', border: '1px solid #292524', color: '#f5f5f4', fontSize: 15, fontWeight: 600, cursor: 'pointer', textAlign: 'left' }}
          >
            {p.name}
          </button>
        ))
      )}
    </div>
  );
}

function App() {
  const [profile, setProfile] = useState(() => {
    try { return JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY)); } catch { return null; }
  });

  const selectProfile = (p) => {
    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(p));
    setProfile(p);
  };

  const switchProfile = () => {
    localStorage.removeItem(PROFILE_STORAGE_KEY);
    setProfile(null);
  };

  if (!profile) return <ProfilePicker onSelect={selectProfile} />;
  return <TrainingLog profileId={profile.id} profileName={profile.name} onSwitchProfile={switchProfile} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

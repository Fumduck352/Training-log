class StateNotFoundError extends Error {
  constructor() { super('no saved state for this profile'); this.name = 'StateNotFoundError'; }
}

// ---- API-backed replacement for the artifact-only window.storage API ----
// Backed by /api/state (Postgres via the Express server), scoped per profile
// so each person's data is independent, visible from their phone, the
// browser, and Claude reading the API directly.
const storage = {
  async get(profileId) {
    let res;
    try {
      res = await fetch(`/api/state?profile=${encodeURIComponent(profileId)}`);
    } catch (err) {
      throw new Error('network error');
    }
    if (!res.ok) throw new Error(`server error ${res.status}`);
    let data;
    try {
      data = await res.json();
    } catch {
      throw new Error('bad JSON response');
    }
    if (data.value === null || data.value === undefined) throw new StateNotFoundError();
    return { value: JSON.stringify(data.value) };
  },
  async set(profileId, value) {
    const res = await fetch(`/api/state?profile=${encodeURIComponent(profileId)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: JSON.parse(value) }),
    });
    if (!res.ok) throw new Error('failed to save state');
    return { value };
  }
};

const ROTATION_PACK_IDS = ['A', 'B', 'C', 'D'];
// Pack A is the active pack starting this calendar month; the sequence
// then advances A->B->C->D->A on the first Monday of every month after.
const ROTATION_CONFIG = { startYear: 2026, startMonth: 11 };

// Reads "now" as Europe/London calendar fields, without trusting the
// device's own timezone — the spec requires Europe/London as the
// authority, not whatever timezone the phone happens to be set to.
function getLondonDateParts(date) {
  const parts = new Intl.DateTimeFormat('en-GB', {
    timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'short',
  }).formatToParts(date);
  const get = t => parts.find(p => p.type === t).value;
  const weekdayMap = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  return { year: Number(get('year')), month: Number(get('month')), day: Number(get('day')), weekday: weekdayMap[get('weekday')] };
}

// Day-of-month of the first Monday of the given Europe/London calendar
// month. Uses a safe midday UTC instant so DST transitions near midnight
// never shift which calendar day we land on.
function firstMondayDayOfMonth(year, month1based) {
  const noonUtc = new Date(Date.UTC(year, month1based - 1, 1, 12, 0, 0));
  const { weekday } = getLondonDateParts(noonUtc);
  const offset = (1 - weekday + 7) % 7;
  return 1 + offset;
}

// Which pack (A-D) is active right now. Counts first-Monday boundaries
// crossed since the configured start month, modulo 4. This is computed
// fresh on read, never recalculated for a day that's already been
// completed (see daySnapshots) — history keeps the pack it was actually
// done under, until it expires (see isSnapshotExpired).
function resolveActivePack(now) {
  const monthsElapsed = resolveMonthsElapsed(now);
  const idx = ((monthsElapsed % 4) + 4) % 4;
  return ROTATION_PACK_IDS[idx];
}

// Raw count of first-Monday boundaries crossed since the configured start
// month — not wrapped to a pack index. Stamped onto a day snapshot when
// it's completed, so later we can tell how many months have passed since.
function resolveMonthsElapsed(now) {
  const { year, month, day } = getLondonDateParts(now || new Date());
  const firstMonday = firstMondayDayOfMonth(year, month);
  let effYear = year, effMonth = month;
  if (day < firstMonday) {
    effMonth -= 1;
    if (effMonth === 0) { effMonth = 12; effYear -= 1; }
  }
  return (effYear - ROTATION_CONFIG.startYear) * 12 + (effMonth - ROTATION_CONFIG.startMonth);
}

// A frozen day snapshot expires once 2 months (2 first-Monday boundaries)
// have passed since it was completed — after that it stops blocking
// progression and the day goes back to tracking the live pack as if it
// were never done, rather than sitting frozen on an old pack forever.
function isSnapshotExpired(snap, currentMonthIndex) {
  return !!snap && (currentMonthIndex - snap.monthIndex) >= 2;
}

function defaultRotationDaySnapshots() {
  return { 1: { '1': null, '2': null, '3': null, '4': null }, 2: { '1': null, '2': null, '3': null, '4': null } };
}

function defaultRotationMeta() {
  return { week: 1, completedDays: { 1: defaultCompletedDays(), 2: defaultCompletedDays() }, daySnapshots: defaultRotationDaySnapshots() };
}

// Builds a WEEKS[week]-shaped object (label + ordered exercise ids per
// day) for the rotation programme, so the rest of the app's render code
// can treat classic and rotation identically. A day that's already been
// completed keeps the exact pack/exercise list it was completed under,
// even after the month rolls over to a new pack — unless that snapshot
// has expired (2+ months old), in which case it shows the live pack again.
function getRotationDaysForWeek(rotationMeta, activePackId, week, currentMonthIndex) {
  const result = {};
  Object.keys(DAY_LABELS).forEach(d => {
    const snap = rotationMeta.daySnapshots[week][d];
    const liveSnap = snap && !isSnapshotExpired(snap, currentMonthIndex) ? snap : null;
    const exercises = liveSnap ? liveSnap.exercises : ROTATION_PACKS[activePackId][week][d].exercises;
    result[d] = { label: DAY_LABELS[d], exercises, packId: liveSnap ? liveSnap.packId : activePackId };
  });
  return result;
}

// A day only reads as green when it's both marked done AND its snapshot
// hasn't expired — an expired day shows back as not-done, since it's now
// displaying the live pack's (different) exercises, not what was logged.
function getEffectiveRotationCompletedDays(rotationMeta, week, currentMonthIndex) {
  const result = {};
  Object.keys(DAY_LABELS).forEach(d => {
    const snap = rotationMeta.daySnapshots[week][d];
    result[d] = !!rotationMeta.completedDays[week][d] && !isSnapshotExpired(snap, currentMonthIndex);
  });
  return result;
}

// Rotation equivalent of updateMetaAfterAction. Locks in a snapshot (pack
// id + exact exercise list + the month it was done in) the moment a day
// first becomes complete, so a later pack change never rewrites what that
// day actually was. If a completed day is un-done again (e.g. an exercise
// un-skipped) or its snapshot has expired, the snapshot is released so it
// goes back to tracking the live pack.
function updateRotationMetaAfterAction(rotationMeta, week, dayNum, coveredIds, activePackId, dayExerciseIds, currentMonthIndex) {
  const dayComplete = dayExerciseIds.every(exId => coveredIds.includes(exId));
  const completedDays = { ...rotationMeta.completedDays, [week]: { ...rotationMeta.completedDays[week], [dayNum]: dayComplete } };
  let daySnapshots = rotationMeta.daySnapshots;
  const existingSnap = daySnapshots[week][dayNum];
  const existingIsLive = existingSnap && !isSnapshotExpired(existingSnap, currentMonthIndex);
  if (dayComplete && !existingIsLive) {
    daySnapshots = { ...daySnapshots, [week]: { ...daySnapshots[week], [dayNum]: { packId: activePackId, exercises: dayExerciseIds, monthIndex: currentMonthIndex } } };
  } else if (!dayComplete && existingSnap) {
    daySnapshots = { ...daySnapshots, [week]: { ...daySnapshots[week], [dayNum]: null } };
  }
  return { ...rotationMeta, completedDays, daySnapshots };
}

// All exercise ids that belong to one programme's world — every id any
// pack references for rotation (including the handful of ids shared with
// classic), or just EXERCISES' own keys for classic. Used to scope
// "Reset" so it never touches the other programme's data.
function getProgrammeExerciseIds(isRotation) {
  if (!isRotation) return Object.keys(EXERCISES);
  const ids = new Set();
  Object.values(ROTATION_PACKS).forEach(pack => {
    Object.values(pack).forEach(week => {
      Object.values(week).forEach(dayDef => dayDef.exercises.forEach(id => ids.add(id)));
    });
  });
  return [...ids];
}


function defaultCompletedDays() {
  return { '1': false, '2': false, '3': false, '4': false };
}

function defaultMeta() {
  return { week: 1, completedDays: { 1: defaultCompletedDays(), 2: defaultCompletedDays() } };
}

// One exercise's stored data object: weight (+ optional weightL/weightR),
// history, a free-text notes field, hardStreak (consecutive Hard
// verdicts, used to trigger the weight drop), and needsWeight (true for a
// brand-new rotation exercise until its starting weight is set via the
// pencil edit).
function defaultExerciseState(id, ex) {
  return {
    weight: ex.weight, weightL: ex.weightL, weightR: ex.weightR,
    history: [],
    notes: id === 'farmersCarry' ? '40m per set, plus shoulder shrugs after' : '',
    hardStreak: 0,
    needsWeight: !!ex.needsWeight,
  };
}

function buildDefaultState() {
  const s = {};
  Object.entries(ALL_EXERCISES).forEach(([id, ex]) => {
    s[id] = defaultExerciseState(id, ex);
  });
  return s;
}

// Patches older saved state: adds any exercise ids that didn't exist yet
// when it was saved (classic or rotation), backfills hardStreak onto
// older exercise entries that predate it, and ensures __meta (classic
// week/completion tracking), __programme and __rotation all exist.
function normalizeState(loaded) {
  const s = { ...loaded };
  Object.entries(ALL_EXERCISES).forEach(([id, ex]) => {
    if (!s[id]) {
      s[id] = defaultExerciseState(id, ex);
    } else {
      if (s[id].hardStreak === undefined) s[id].hardStreak = 0;
      if (s[id].needsWeight === undefined) s[id].needsWeight = false;
    }
  });
  if (!s.__meta) {
    s.__meta = defaultMeta();
  } else {
    s.__meta = { week: s.__meta.week === 2 ? 2 : 1, completedDays: { ...s.__meta.completedDays } };
    [1, 2].forEach(w => { if (!s.__meta.completedDays[w]) s.__meta.completedDays[w] = defaultCompletedDays(); });
  }
  if (!s.__programme) s.__programme = 'classic';
  if (!s.__rotation) {
    s.__rotation = defaultRotationMeta();
  } else {
    const r = s.__rotation;
    s.__rotation = {
      week: r.week === 2 ? 2 : 1,
      completedDays: { ...r.completedDays },
      daySnapshots: { ...r.daySnapshots },
    };
    [1, 2].forEach(w => {
      if (!s.__rotation.completedDays[w]) s.__rotation.completedDays[w] = defaultCompletedDays();
      if (!s.__rotation.daySnapshots[w]) s.__rotation.daySnapshots[w] = { '1': null, '2': null, '3': null, '4': null };
    });
  }
  return s;
}

// Recomputes whether `dayNum` (in `week`) is fully covered by `coveredIds`
// (logged + skipped exercise ids) and updates completedDays. Stays on the
// same week and leaves every day's green/not-done status exactly as it
// is — even once all 4 days go green — until the person explicitly
// confirms the week's done (see handleConfirmWeekComplete).
function updateMetaAfterAction(meta, week, dayNum, coveredIds) {
  const daysForWeek = WEEKS[week];
  const dayComplete = daysForWeek[dayNum].exercises.every(exId => coveredIds.includes(exId));
  const completedDays = { ...meta.completedDays, [week]: { ...meta.completedDays[week], [dayNum]: dayComplete } };
  return { ...meta, week, completedDays };
}

// Resolves an overall Easy/No Change/Hard verdict for the session from any
// per-set Easy/Hard marks, falling back to whichever "Log Session" button
// was actually pressed when no sets were marked (or the marks are a
// genuine tie) — that fallback is how "No Change" reaches here, since
// there's no per-set "No Change" mark.
function resolveVerdict(marks, buttonPressed, numSets) {
  const touched = marks.filter(Boolean);
  if (touched.length === 0) return buttonPressed;

  if (numSets === 3) {
    const easyCount = touched.filter(m => m === 'easy').length;
    const hardCount = touched.filter(m => m === 'hard').length;
    if (easyCount >= 2) return 'easy';
    if (hardCount >= 2) return 'hard';
    return buttonPressed; // genuine tie fallback
  }

  // 2-set exercises
  if (marks[0] === 'hard' && marks[1] === 'hard') return 'hard';
  const last = [...marks].reverse().find(Boolean);
  return last || buttonPressed;
}

// Decision engine: given the resolved verdict, returns the updated
// weight/hardStreak for an exercise. Reps always stay at the exercise's
// normal target — only weight moves, the same way for noReps exercises
// (Farmer's Carry, Suitcase Carry) and rep-based ones.
// Easy: weight up one increment. No change: weight untouched. Hard: noted;
// two Hard verdicts in a row drop the weight by one increment.
function applyVerdict(ex, cur, verdict) {
  let { weight, hardStreak } = cur;

  if (verdict === 'easy') {
    weight += ex.increment;
    hardStreak = 0;
  } else if (verdict === 'hard') {
    hardStreak += 1;
    if (hardStreak >= 2) {
      weight -= ex.increment;
      hardStreak = 0;
    }
  } else { // noChange
    hardStreak = 0;
  }
  return { weight: +Number(weight).toFixed(2), hardStreak };
}

function CopySummaryButton({ text, label }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      // clipboard API blocked — fall back to a temporary textarea
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch {}
      document.body.removeChild(ta);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  return (
    <button
      onClick={handleCopy}
      style={{ width: '100%', padding: '8px 16px', borderRadius: 8, border: '1px solid #52525b', background: copied ? '#166534' : '#27272a', color: copied ? '#86efac' : '#e4e4e7', fontSize: 13, cursor: 'pointer', marginTop: 6 }}
    >
      {copied ? '✓ Copied — paste it to Claude in chat' : label}
    </button>
  );
}

function ExerciseCard({ id, ex, data, onLog, onSaveNotes, onEditWeight, skipped, onSkip, profileId }) {
  const showElbowCaution = ex.caution && profileId === 'lee';
  const [open, setOpen] = useState(false);
  const [sets, setSets] = useState(Array.from({ length: ex.sets }, () => ({ reps: ex.repMax || '' })));
  const [marks, setMarks] = useState(Array.from({ length: ex.sets }, () => null));
  const [logged, setLogged] = useState(false);
  const [verdict, setVerdict] = useState(null);
  const [note, setNote] = useState(data.notes || '');
  const [editingWeight, setEditingWeight] = useState(false);
  const [editW, setEditW] = useState('');
  const [editWL, setEditWL] = useState('');
  const [editWR, setEditWR] = useState('');

  const weightLabel = ex.weightL !== undefined
    ? `L ${data.weightL}${ex.unit} / R ${data.weightR}${ex.unit}`
    : `${data.weight}${ex.unit}`;

  const trend = data.history.slice(-4).map(h => h.weightLabel).join(' → ');
  const last = data.history[data.history.length - 1];

  const toggleMark = (i, val) => {
    setMarks(prev => prev.map((m, idx) => (idx === i ? (m === val ? null : val) : m)));
  };

  const doLog = (buttonPressed) => {
    const verd = resolveVerdict(marks, buttonPressed, ex.sets);
    setVerdict(verd);
    setLogged(true);
    onLog(id, sets, marks, verd, note);
  };

  const openWeightEdit = () => {
    setEditW(data.weight != null ? String(data.weight) : '');
    setEditWL(data.weightL != null ? String(data.weightL) : '');
    setEditWR(data.weightR != null ? String(data.weightR) : '');
    setEditingWeight(true);
  };

  const handleSaveWeight = (e) => {
    e.stopPropagation();
    const updates = ex.weightL !== undefined
      ? { weightL: parseFloat(editWL) || 0, weightR: parseFloat(editWR) || 0 }
      : { weight: parseFloat(editW) || 0 };
    onEditWeight(id, updates);
    setEditingWeight(false);
  };

  const handleCancelWeight = (e) => {
    e.stopPropagation();
    setEditingWeight(false);
  };

  const markLabel = m => (m === 'easy' ? 'Easy' : m === 'hard' ? 'Hard' : m === 'noChange' ? 'No Change' : '');

  const summaryText = (() => {
    const wLabel = ex.weightL !== undefined ? `L ${data.weightL}kg / R ${data.weightR}kg` : `${data.weight}${ex.unit}`;
    const setsDesc = sets.map((s, i) => {
      const m = markLabel(marks[i]);
      return ex.noReps ? `Set ${i+1}${m ? `: ${m}` : ''}` : `Set ${i+1}: ${s.reps} reps${m ? ` — ${m}` : ''}`;
    }).join(', ');
    let text =
      `[Training log — ${ex.name}]\n` +
      `Weight: ${wLabel} | Sets: ${setsDesc} | Target: ${ex.noReps ? 'carries' : `${ex.repMin}–${ex.repMax} reps`}\n` +
      `Session verdict: ${verdict ? markLabel(verdict) : 'N/A'}` +
      (showElbowCaution ? `\nRight elbow caution: YES` : '');
    if (note.trim()) text += `\nMy note: ${note}`;
    return text + `\n\nCan you give me a quick read on this and what to do next time?`;
  })();

  return (
    <div style={{ border: '1px solid #292524', borderRadius: 12, background: '#1c1917', marginBottom: 8, overflow: 'hidden' }}>
      <div
        onClick={() => setOpen(o => !o)}
        style={{ width: '100%', display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 14px', cursor: 'pointer', textAlign: 'left' }}
      >
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap' }}>
            <span style={{ fontSize: 14, fontWeight: 600, color: skipped ? '#57534e' : logged ? '#86efac' : '#f5f5f4' }}>
              {skipped ? '⊘ ' : logged ? '✓ ' : ''}{ex.name}
            </span>
            {skipped && (
              <span style={{ fontSize: 11, color: '#57534e' }}>skipped today</span>
            )}
            {showElbowCaution && (
              <span style={{ fontSize: 11, background: '#431407', color: '#fb923c', padding: '1px 6px', borderRadius: 4, border: '1px solid #7c2d12', flexShrink: 0 }}>
                ⚠ elbow
              </span>
            )}
            {ex.video && (
              <a
                href={ex.video} target="_blank" rel="noopener noreferrer"
                onClick={e => e.stopPropagation()}
                style={{ fontSize: 11, color: '#60a5fa', textDecoration: 'none', flexShrink: 0 }}
              >
                ▶ Watch
              </a>
            )}
          </div>
          <div style={{ fontSize: 14, color: '#f5f5f4', marginTop: 2, display: 'flex', alignItems: 'center', gap: 6 }}>
            <span>{weightLabel} · {ex.sets} × {ex.noReps ? 'carries' : (ex.repMin === ex.repMax ? ex.repMin : `${ex.repMin}–${ex.repMax}`)}</span>
            <button
              onClick={e => { e.stopPropagation(); editingWeight ? setEditingWeight(false) : openWeightEdit(); }}
              style={{ background: 'none', border: 'none', color: '#78716c', fontSize: 12, cursor: 'pointer', padding: 0, flexShrink: 0 }}
            >
              ✏️
            </button>
          </div>
          {editingWeight && (
            <div onClick={e => e.stopPropagation()} style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6, flexWrap: 'wrap' }}>
              {ex.weightL !== undefined ? (
                <>
                  <input
                    type="number" inputMode="decimal" value={editWL} placeholder="Left"
                    onChange={e => setEditWL(e.target.value)}
                    style={{ width: 64, background: '#0c0a09', border: '1px solid #3f3f46', borderRadius: 8, padding: '5px 7px', fontSize: 12, color: '#f5f5f4' }}
                  />
                  <input
                    type="number" inputMode="decimal" value={editWR} placeholder="Right"
                    onChange={e => setEditWR(e.target.value)}
                    style={{ width: 64, background: '#0c0a09', border: '1px solid #3f3f46', borderRadius: 8, padding: '5px 7px', fontSize: 12, color: '#f5f5f4' }}
                  />
                </>
              ) : (
                <input
                  type="number" inputMode="decimal" value={editW}
                  onChange={e => setEditW(e.target.value)}
                  style={{ width: 70, background: '#0c0a09', border: '1px solid #3f3f46', borderRadius: 8, padding: '5px 7px', fontSize: 12, color: '#f5f5f4' }}
                />
              )}
              <button onClick={handleSaveWeight} style={{ fontSize: 12, fontWeight: 600, padding: '5px 10px', borderRadius: 6, background: '#166534', border: 'none', color: '#fff', cursor: 'pointer' }}>Save</button>
              <button onClick={handleCancelWeight} style={{ fontSize: 12, padding: '5px 10px', borderRadius: 6, background: 'none', border: '1px solid #3f3f46', color: '#a8a29e', cursor: 'pointer' }}>Cancel</button>
            </div>
          )}
          {data.notes && (
            <div style={{ fontSize: 14, color: '#f5f5f4', marginTop: 1, fontStyle: 'italic', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              {data.notes}
            </div>
          )}
        </div>
        <span style={{ color: '#78716c', fontSize: 16, marginLeft: 8, flexShrink: 0 }}>{open ? '▲' : '▼'}</span>
      </div>

      {open && skipped && (
        <div style={{ borderTop: '1px solid #292524', padding: '12px 14px' }}>
          <div style={{ fontSize: 13, color: '#78716c', marginBottom: 10 }}>
            Marked as skipped for today — won't affect your weight or history.
          </div>
          <button
            onClick={() => onSkip(id)}
            style={{ width: '100%', padding: 10, borderRadius: 8, background: '#27272a', border: '1px solid #3f3f46', color: '#e4e4e7', fontSize: 13, cursor: 'pointer' }}
          >
            Undo — I did do this today
          </button>
        </div>
      )}

      {open && !skipped && (
        <div style={{ borderTop: '1px solid #292524', padding: '12px 14px' }}>
          {data.needsWeight && (
            <div style={{ fontSize: 12, color: '#fca5a5', background: 'rgba(127,29,29,0.3)', border: '1px solid rgba(220,38,38,0.4)', borderRadius: 8, padding: '7px 10px', marginBottom: 10 }}>
              ⚠ New exercise — set your starting weight with the ✏️ pencil above before logging.
            </div>
          )}
          {ex.note && (!ex.caution || showElbowCaution) && (
            <div style={{ fontSize: 12, color: '#fbbf24', background: 'rgba(120,53,15,0.3)', border: '1px solid rgba(161,98,7,0.4)', borderRadius: 8, padding: '7px 10px', marginBottom: 10 }}>
              ℹ {ex.note}
            </div>
          )}
          {trend && <div style={{ fontSize: 14, color: '#f5f5f4', marginBottom: 10 }}>📈 {trend}</div>}

          {sets.map((s, i) => (
            <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 7 }}>
              <span style={{ fontSize: 14, color: '#f5f5f4', width: 44, flexShrink: 0 }}>Set {i+1}</span>
              {!ex.noReps && (
                <input
                  type="number" inputMode="numeric" value={s.reps}
                  onChange={e => setSets(prev => prev.map((x, idx) => idx === i ? { ...x, reps: e.target.value === '' ? '' : Number(e.target.value) } : x))}
                  placeholder="reps"
                  style={{ width: 60, background: '#0c0a09', border: '1px solid #292524', borderRadius: 8, padding: '6px 8px', fontSize: 14, color: '#f5f5f4', textAlign: 'center' }}
                />
              )}
              <div style={{ display: 'flex', gap: 4, flex: 1 }}>
                <button
                  onClick={() => toggleMark(i, 'easy')}
                  style={{ flex: 1, padding: '6px 4px', borderRadius: 8, border: '1px solid #444', background: marks[i] === 'easy' ? '#166534' : 'transparent', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                >
                  Easy
                </button>
                <button
                  onClick={() => toggleMark(i, 'hard')}
                  style={{ flex: 1, padding: '6px 4px', borderRadius: 8, border: '1px solid #444', background: marks[i] === 'hard' ? '#991b1b' : 'transparent', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
                >
                  Hard
                </button>
              </div>
            </div>
          ))}

          <div style={{ marginTop: 10 }}>
            <textarea
              value={note}
              onChange={e => setNote(e.target.value)}
              onBlur={() => onSaveNotes(id, note)}
              rows={2}
              placeholder="Notes — variations, distances, swaps…"
              style={{ width: '100%', background: '#0c0a09', border: '1px solid #292524', borderRadius: 8, padding: '7px 10px', fontSize: 12, color: '#e7e5e4', resize: 'none', fontFamily: 'system-ui', boxSizing: 'border-box' }}
            />
          </div>

          <div style={{ fontSize: 11, color: '#78716c', marginTop: 8, marginBottom: 4 }}>Log Session</div>
          <div style={{ display: 'flex', gap: 6 }}>
            <button
              onClick={() => doLog('easy')}
              style={{ flex: 1, padding: '10px 4px', borderRadius: 8, background: '#166534', border: 'none', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
            >
              Easy
            </button>
            <button
              onClick={() => doLog('noChange')}
              style={{ flex: 1, padding: '10px 4px', borderRadius: 8, background: '#44403c', border: 'none', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
            >
              No Change
            </button>
            <button
              onClick={() => doLog('hard')}
              style={{ flex: 1, padding: '10px 4px', borderRadius: 8, background: '#991b1b', border: 'none', color: '#fff', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}
            >
              Hard
            </button>
          </div>

          {!logged && (
            <button
              onClick={() => onSkip(id)}
              style={{ width: '100%', padding: 6, background: 'none', border: 'none', color: '#57534e', fontSize: 12, cursor: 'pointer', marginTop: 6 }}
            >
              Didn't do this today
            </button>
          )}

          {logged && (
            <div style={{ marginTop: 10, padding: '12px', borderRadius: 10, border: '1px solid #3f3f46', background: '#18181b' }}>
              <div style={{ fontSize: 12, color: '#a1a1aa', marginBottom: 6, fontWeight: 600 }}>
                Verdict: {markLabel(verdict)}
              </div>
              <CopySummaryButton text={summaryText} label="Copy summary to ask Claude →" />
            </div>
          )}

          {last && (
            <div style={{ fontSize: 14, color: '#f5f5f4', marginTop: 10 }}>
              Last ({last.weightLabel}): {last.sets.map(s => ex.noReps ? (markLabel(s.mark) || '–') : `${s.reps}${s.mark ? `(${markLabel(s.mark)})` : ''}`).join(', ')}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function SessionSummary({ day, exData, loggedIds, skippedIds, onDone, profileId }) {
  const increases = loggedIds.map(id => {
    const hist = exData[id].history;
    if (hist.length < 2) return null;
    const prev = hist[hist.length - 2]?.weightLabel;
    const curr = hist[hist.length - 1]?.weightLabel;
    if (prev && curr && prev !== curr) return `${ALL_EXERCISES[id].name}: ${prev} → ${curr}`;
    return null;
  }).filter(Boolean);

  const summaryText = (() => {
    const lines = loggedIds.map(id => {
      const ex = ALL_EXERCISES[id];
      const last = exData[id].history[exData[id].history.length - 1];
      if (!last) return null;
      const setsDesc = last.sets.map(s => ex.noReps ? (s.mark || 'no mark') : `${s.reps}${s.mark ? ` (${s.mark})` : ''}`).join(', ');
      return `• ${ex.name} (${last.weightLabel}): ${setsDesc}`;
    }).filter(Boolean).join('\n');

    return `[Training log — Day ${day} session complete]\n\n` +
      `Exercises logged:\n${lines}\n\n` +
      `Weight increases this session:\n${increases.length ? increases.map(i => `• ${i}`).join('\n') : '• None'}\n\n` +
      `Can you give me a quick review${profileId === 'lee' ? ', flag anything for my right elbow (tennis elbow),' : ','} and give one priority focus for next time?`;
  })();

  return (
    <div style={{ margin: '16px 0', border: '1px solid #3f3f46', borderRadius: 14, background: '#18181b', overflow: 'hidden' }}>
      <div style={{ padding: '14px 16px', borderBottom: '1px solid #27272a' }}>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#f4f4f5' }}>Session complete 🎉</div>
        <div style={{ fontSize: 13, color: '#71717a', marginTop: 2 }}>
          Day {day} · {loggedIds.length} exercises logged
          {skippedIds.length > 0 && ` · ${skippedIds.length} skipped`}
        </div>
      </div>

      {increases.length > 0 && (
        <div style={{ padding: '12px 16px', borderBottom: '1px solid #27272a' }}>
          <div style={{ fontSize: 11, color: '#71717a', marginBottom: 6, fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.06em' }}>Weight increases</div>
          {increases.map((inc, i) => (
            <div key={i} style={{ fontSize: 13, color: '#86efac', marginBottom: 3 }}>↑ {inc}</div>
          ))}
        </div>
      )}

      <div style={{ padding: '12px 16px', display: 'flex', flexDirection: 'column', gap: 8 }}>
        <CopySummaryButton text={summaryText} label="Copy session summary to ask Claude →" />
        <button
          onClick={onDone}
          style={{ width: '100%', padding: 11, borderRadius: 8, background: '#16a34a', border: 'none', color: '#fff', fontSize: 14, fontWeight: 700, cursor: 'pointer' }}
        >
          Finish &amp; save session ✓
        </button>
      </div>
    </div>
  );
}

function CoachFeedback({ profileId }) {
  const [items, setItems] = useState([]);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch(`/api/feedback?profile=${encodeURIComponent(profileId)}&unread=true`);
        if (res.ok) setItems(await res.json());
      } catch {}
      setLoaded(true);
    })();
  }, [profileId]);

  const dismiss = async (id) => {
    setItems(prev => prev.filter(i => i.id !== id));
    try { await fetch(`/api/feedback/${id}/read`, { method: 'PATCH' }); } catch {}
  };

  if (!loaded || items.length === 0) return null;

  return (
    <div style={{ marginBottom: 16 }}>
      {items.map(item => (
        <div key={item.id} style={{ border: '1px solid #1e3a8a', background: 'rgba(30,58,138,0.2)', borderRadius: 10, padding: '10px 12px', marginBottom: 8 }}>
          <div style={{ fontSize: 11, color: '#93c5fd', fontWeight: 600, marginBottom: 4, textTransform: 'uppercase', letterSpacing: '0.05em' }}>
            Coach note{item.exercise_id && ALL_EXERCISES[item.exercise_id] ? ` — ${ALL_EXERCISES[item.exercise_id].name}` : ''}
          </div>
          <div style={{ fontSize: 13, color: '#dbeafe', whiteSpace: 'pre-wrap' }}>{item.message}</div>
          <button
            onClick={() => dismiss(item.id)}
            style={{ marginTop: 8, fontSize: 12, color: '#93c5fd', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}
          >
            Dismiss
          </button>
        </div>
      ))}
    </div>
  );
}

function TrainingLog({ profileId, profileName, onSwitchProfile }) {
  const [day, setDay] = useState('1');
  const [exData, setExData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(false);
  const [loadKey, setLoadKey] = useState(0);
  const [loggedIds, setLoggedIds] = useState([]);
  const [skippedIds, setSkippedIds] = useState([]);
  const [sessionDone, setSessionDone] = useState(false);
  const [manualOpen, setManualOpen] = useState(false);

  useEffect(() => {
    setLoadError(false);
    (async () => {
      let s;
      try {
        const r = await storage.get(profileId);
        s = normalizeState(JSON.parse(r.value));
      } catch (err) {
        if (err instanceof StateNotFoundError) {
          s = normalizeState(buildDefaultState());
        } else {
          setLoadError(true);
          setLoading(false);
          return;
        }
      }
      setExData(s);
      try { await storage.set(profileId, JSON.stringify(s)); } catch {}
      setLoading(false);
    })();
  }, [profileId, loadKey]);

  useEffect(() => { setLoggedIds([]); setSkippedIds([]); setSessionDone(false); }, [day]);

  const persist = async (next) => {
    setExData(next);
    try { await storage.set(profileId, JSON.stringify(next)); } catch {}
  };

  const handleLog = (id, sets, marks, verdict, note) => {
    const ex = ALL_EXERCISES[id];
    const cur = exData[id];
    const today = new Date().toISOString().slice(0,10);
    const historySets = sets.map((s, i) => ex.noReps ? { mark: marks[i] } : { reps: s.reps, mark: marks[i] });
    let next = { ...cur, history: [...cur.history], notes: note };

    if (ex.weightL !== undefined) {
      const result = applyVerdict(ex, { weight: cur.weightL, hardStreak: cur.hardStreak }, verdict);
      next.weightL = result.weight;
      next.hardStreak = result.hardStreak;
      next.history.push({ date: today, weightLabel: `L${next.weightL}/R${cur.weightR}`, sets: historySets });
    } else {
      const result = applyVerdict(ex, cur, verdict);
      next.weight = result.weight;
      next.hardStreak = result.hardStreak;
      next.history.push({ date: today, weightLabel: `${next.weight}${ex.unit}`, sets: historySets });
    }
    next.history = next.history.slice(-6);

    const nextLoggedIds = loggedIds.includes(id) ? loggedIds : [...loggedIds, id];
    const coveredIds = [...nextLoggedIds, ...skippedIds];
    const metaKey = isRotation ? '__rotation' : '__meta';
    const nextMeta = isRotation
      ? updateRotationMetaAfterAction(exData.__rotation, week, day, coveredIds, activePack, daysForWeek[day].exercises, currentMonthIndex)
      : updateMetaAfterAction(exData.__meta, week, day, coveredIds);

    persist({ ...exData, [id]: next, [metaKey]: nextMeta });
    setLoggedIds(nextLoggedIds);
  };

  const handleSaveNotes = (id, note) => {
    const cur = { ...exData[id], notes: note };
    persist({ ...exData, [id]: cur });
  };

  const handleEditWeight = (id, updates) => {
    const cur = { ...exData[id], ...updates, needsWeight: false };
    persist({ ...exData, [id]: cur });
  };

  const handleSkip = (id) => {
    const nextSkippedIds = skippedIds.includes(id) ? skippedIds.filter(x => x !== id) : [...skippedIds, id];

    const coveredIds = [...loggedIds, ...nextSkippedIds];
    const metaKey = isRotation ? '__rotation' : '__meta';
    const nextMeta = isRotation
      ? updateRotationMetaAfterAction(exData.__rotation, week, day, coveredIds, activePack, daysForWeek[day].exercises, currentMonthIndex)
      : updateMetaAfterAction(exData.__meta, week, day, coveredIds);

    persist({ ...exData, [metaKey]: nextMeta });
    setSkippedIds(nextSkippedIds);
  };

  // Scoped to whichever programme is currently active — resetting Rotation
  // never touches Classic's weights/history, and vice versa. Exercise ids
  // that are deliberately shared between the two (e.g. legPress) do reset
  // in both views, since they're genuinely the same stored weight.
  const handleReset = async () => {
    const label = isRotation ? 'Monthly Rotation' : 'Classic';
    const otherLabel = isRotation ? 'Classic' : 'Monthly Rotation';
    if (!window.confirm(`Reset ${label} progress back to starting weights? This won't touch ${otherLabel}.`)) return;
    const idsToReset = getProgrammeExerciseIds(isRotation);
    const resetExercises = {};
    idsToReset.forEach(id => { resetExercises[id] = defaultExerciseState(id, ALL_EXERCISES[id]); });
    const metaKey = isRotation ? '__rotation' : '__meta';
    const resetMeta = isRotation ? defaultRotationMeta() : defaultMeta();
    await persist({ ...exData, ...resetExercises, [metaKey]: resetMeta });
    setDay('1');
    setLoggedIds([]);
    setSkippedIds([]);
    setSessionDone(false);
  };

  const handleForceWeekSwitch = () => {
    const nextWeek = week === 1 ? 2 : 1;
    if (!window.confirm(`Switch to Week ${nextWeek} now?`)) return;
    const metaKey = isRotation ? '__rotation' : '__meta';
    persist({ ...exData, [metaKey]: { ...activeMeta, week: nextWeek } });
    setDay('1');
    setLoggedIds([]);
    setSkippedIds([]);
    setSessionDone(false);
  };

  // Only touches completedDays once you explicitly confirm — all 4 days
  // stay green (and the week stays put) for as long as you like otherwise.
  const handleConfirmWeekComplete = () => {
    const nextWeek = week === 1 ? 2 : 1;
    if (!window.confirm(`Week ${week} complete — clear its days and start Week ${nextWeek}?`)) return;
    const completedDays = { ...activeMeta.completedDays, [week]: defaultCompletedDays() };
    const metaKey = isRotation ? '__rotation' : '__meta';
    let nextMetaObj = { ...activeMeta, week: nextWeek, completedDays };
    if (isRotation) {
      nextMetaObj = { ...nextMetaObj, daySnapshots: { ...activeMeta.daySnapshots, [week]: { '1': null, '2': null, '3': null, '4': null } } };
    }
    persist({ ...exData, [metaKey]: nextMetaObj });
    setDay('1');
    setLoggedIds([]);
    setSkippedIds([]);
    setSessionDone(false);
  };

  // Switches between the classic and rotation programmes. Each keeps its
  // own week/day-completion state (__meta vs __rotation) — nothing here
  // is shared, so switching back later shows exactly what was left.
  const handleToggleProgramme = () => {
    const nextProgramme = programme === 'rotation' ? 'classic' : 'rotation';
    const label = nextProgramme === 'rotation' ? 'Monthly Rotation' : 'Classic';
    if (!window.confirm(`Switch to the ${label} programme? Your progress in both is kept separately.`)) return;
    persist({ ...exData, __programme: nextProgramme });
    setDay('1');
    setLoggedIds([]);
    setSkippedIds([]);
    setSessionDone(false);
  };

  const programme = exData ? (exData.__programme || 'classic') : 'classic';
  const isRotation = programme === 'rotation';
  const activePack = resolveActivePack();
  const currentMonthIndex = resolveMonthsElapsed();
  const activeMeta = exData && (isRotation ? exData.__rotation : exData.__meta);
  const week = activeMeta && activeMeta.week;
  const daysForWeek = exData && (isRotation ? getRotationDaysForWeek(exData.__rotation, activePack, week, currentMonthIndex) : WEEKS[week]);
  const completedDaysForWeek = exData && (isRotation ? getEffectiveRotationCompletedDays(exData.__rotation, week, currentMonthIndex) : activeMeta.completedDays[week]);
  const allLogged = exData && daysForWeek[day].exercises.every(id => loggedIds.includes(id) || skippedIds.includes(id));
  const weekAllComplete = exData && Object.keys(daysForWeek).every(d => completedDaysForWeek[d]);

  if (loadError) return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#0c0a09', color: '#f5f5f4', fontFamily: 'system-ui', padding: 24, textAlign: 'center' }}>
      <div style={{ fontSize: 14, color: '#f87171', marginBottom: 12 }}>Couldn't load your data — nothing was changed.</div>
      <button
        onClick={() => { setLoading(true); setLoadKey(k => k + 1); }}
        style={{ padding: '10px 20px', borderRadius: 8, background: '#1c1917', border: '1px solid #292524', color: '#f5f5f4', fontSize: 14, cursor: 'pointer' }}
      >
        Try again
      </button>
    </div>
  );

  if (loading) return (
    <div style={{ minHeight: 200, display: 'flex', alignItems: 'center', justifyContent: 'center', background: '#0c0a09', color: '#78716c', fontFamily: 'system-ui' }}>
      Loading…
    </div>
  );

  return (
    <div style={{ minHeight: '100vh', background: '#0c0a09', color: '#f5f5f4', padding: '16px', maxWidth: 480, margin: '0 auto', fontFamily: 'system-ui, sans-serif' }}>
      <div style={{ display: 'flex', gap: 6, marginBottom: 10 }}>
        <button
          onClick={() => setManualOpen(true)}
          style={{ flex: 1, fontSize: 12, fontWeight: 600, padding: '6px 4px', background: '#1d4ed8', border: '1px solid #1d4ed8', color: '#fff', borderRadius: 8, cursor: 'pointer' }}
        >
          📖 Manual
        </button>
        <button
          onClick={handleToggleProgramme}
          style={{ flex: 1, fontSize: 12, fontWeight: 600, padding: '6px 4px', background: '#1d4ed8', border: '1px solid #1d4ed8', color: '#fff', borderRadius: 8, cursor: 'pointer' }}
        >
          {isRotation ? '📅 Rotation' : '📋 Classic'} ⇄
        </button>
        <button
          onClick={handleForceWeekSwitch}
          style={{ flex: 1, fontSize: 12, fontWeight: 600, padding: '6px 4px', background: '#1d4ed8', border: '1px solid #1d4ed8', color: '#fff', borderRadius: 8, cursor: 'pointer' }}
        >
          Week {week === 1 ? 2 : 1} →
        </button>
      </div>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 4 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: 22 }}>🏋️</span>
          <h1 style={{ fontSize: 18, fontWeight: 700, margin: 0 }}>Training Log — {profileName}</h1>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: '#78716c' }}>
          Week {week} · Day {day} — {daysForWeek[day].label}
          {isRotation && <> · Pack {daysForWeek[day].packId}</>}
        </div>
        <button
          onClick={onSwitchProfile}
          style={{ fontSize: 11, color: '#57534e', background: 'none', border: 'none', cursor: 'pointer', padding: 0 }}
        >
          Not {profileName}?
        </button>
      </div>

      <CoachFeedback profileId={profileId} />

      <div style={{ display: 'flex', gap: 6, marginBottom: 16 }}>
        {Object.keys(daysForWeek).map(d => {
          const isSelected = d === day;
          const isComplete = completedDaysForWeek[d];
          const bg = isSelected ? '#c2410c' : isComplete ? '#166534' : '#1c1917';
          const borderColor = isSelected ? '#c2410c' : isComplete ? '#16a34a' : '#292524';
          const color = isSelected || isComplete ? '#fff' : '#78716c';
          return (
            <button key={d} onClick={() => setDay(d)} style={{
              flex: 1, padding: '8px 4px', borderRadius: 8,
              border: '1px solid', borderColor, background: bg, color,
              fontSize: 13, fontWeight: 600, cursor: 'pointer'
            }}>
              Day {d}
            </button>
          );
        })}
      </div>

      {weekAllComplete && (
        <button
          onClick={handleConfirmWeekComplete}
          style={{ width: '100%', padding: 10, borderRadius: 8, background: '#166534', border: '1px solid #16a34a', color: '#fff', fontSize: 13, fontWeight: 600, cursor: 'pointer', marginBottom: 16 }}
        >
          ✅ Week {week} Complete — Start Week {week === 1 ? 2 : 1}
        </button>
      )}

      {sessionDone ? (
        <div style={{ textAlign: 'center', padding: '40px 20px' }}>
          <div style={{ fontSize: 40, marginBottom: 12 }}>✅</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: '#86efac', marginBottom: 6 }}>Session saved!</div>
          <div style={{ fontSize: 14, color: '#78716c', marginBottom: 20 }}>All weights and notes updated for next time.</div>
          <button
            onClick={() => { setSessionDone(false); setLoggedIds([]); setSkippedIds([]); }}
            style={{ padding: '10px 24px', borderRadius: 8, background: '#1c1917', border: '1px solid #292524', color: '#f5f5f4', fontSize: 14, cursor: 'pointer' }}
          >
            Start another session
          </button>
        </div>
      ) : (
        <>
          {daysForWeek[day].exercises.map((id, idx) => (
            <ExerciseCard
              key={`${week}-${day}-${id}-${idx}`}
              id={id} ex={ALL_EXERCISES[id]} data={exData[id]}
              onLog={handleLog} onSaveNotes={handleSaveNotes} onEditWeight={handleEditWeight}
              skipped={skippedIds.includes(id)} onSkip={handleSkip}
              profileId={profileId}
            />
          ))}

          {(loggedIds.length > 0 || skippedIds.length > 0) && !allLogged && (
            <>
              <div style={{ textAlign: 'center', fontSize: 13, color: '#57534e', padding: '10px 0' }}>
                {loggedIds.length + skippedIds.length} / {daysForWeek[day].exercises.length} exercises done
              </div>
              <button
                onClick={() => setSessionDone(true)}
                style={{ width: '100%', padding: 10, borderRadius: 8, background: 'none', border: '1px solid #292524', color: '#57534e', fontSize: 13, cursor: 'pointer' }}
              >
                Finish early (save partial session)
              </button>
            </>
          )}

          {allLogged && (
            <SessionSummary day={day} exData={exData} loggedIds={loggedIds} skippedIds={skippedIds} onDone={() => setSessionDone(true)} profileId={profileId} />
          )}
        </>
      )}

      <button
        onClick={handleReset}
        style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12, color: '#44403c', background: 'none', border: 'none', cursor: 'pointer', margin: '24px auto 0', padding: 6 }}
      >
        ↺ Reset all progress
      </button>

      {manualOpen && <ManualModal onClose={() => setManualOpen(false)} />}
    </div>
  );
}

const PROFILE_STORAGE_KEY = 'trainingLogProfile';

// Fixed roster picker — no self-signup. Lee assigns spare slots to real
// people (via a rename), so this just lists whoever the server already
// knows about.
function ProfilePicker({ onSelect }) {
  const [profiles, setProfiles] = useState(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await fetch('/api/profiles');
        setProfiles(res.ok ? await res.json() : []);
      } catch {
        setProfiles([]);
      }
    })();
  }, []);

  return (
    <div style={{ minHeight: '100vh', background: '#0c0a09', color: '#f5f5f4', padding: '16px', maxWidth: 480, margin: '0 auto', fontFamily: 'system-ui, sans-serif', display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
      <div style={{ textAlign: 'center', marginBottom: 24 }}>
        <div style={{ fontSize: 32 }}>🏋️</div>
        <h1 style={{ fontSize: 20, fontWeight: 700, margin: '8px 0 4px' }}>Who's training?</h1>
        <div style={{ fontSize: 13, color: '#78716c' }}>Each person has their own weights and history.</div>
      </div>

      {profiles === null ? (
        <div style={{ textAlign: 'center', color: '#78716c' }}>Loading…</div>
      ) : profiles.length === 0 ? (
        <div style={{ textAlign: 'center', color: '#78716c' }}>Couldn't load the list — try reloading.</div>
      ) : (
        profiles.map(p => (
          <button
            key={p.id}
            onClick={() => onSelect(p)}
            style={{ width: '100%', padding: 14, borderRadius: 10, marginBottom: 8, background: '#1c1917', border: '1px solid #292524', color: '#f5f5f4', fontSize: 15, fontWeight: 600, cursor: 'pointer', textAlign: 'left' }}
          >
            {p.name}
          </button>
        ))
      )}
    </div>
  );
}

// Polls the server for a new deploy (index.html's mtime) and reloads the
// tab the moment it changes. People who leave this app open for weeks
// otherwise never pick up a new version on their own.
function useAutoReloadOnDeploy() {
  useEffect(() => {
    let knownVersion = null;
    const check = async () => {
      try {
        const res = await fetch('/api/version');
        if (!res.ok) return;
        const { version } = await res.json();
        if (knownVersion === null) { knownVersion = version; return; }
        if (version !== knownVersion) window.location.reload();
      } catch {}
    };
    check();
    const interval = setInterval(check, 60000);
    return () => clearInterval(interval);
  }, []);
}

function App() {
  useAutoReloadOnDeploy();
  const [profile, setProfile] = useState(() => {
    try { return JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY)); } catch { return null; }
  });

  const selectProfile = (p) => {
    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(p));
    setProfile(p);
  };

  const switchProfile = () => {
    localStorage.removeItem(PROFILE_STORAGE_KEY);
    setProfile(null);
  };

  if (!profile) return <ProfilePicker onSelect={selectProfile} />;
  return <TrainingLog profileId={profile.id} profileName={profile.name} onSwitchProfile={switchProfile} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
